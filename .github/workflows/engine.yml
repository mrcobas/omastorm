              apt_bundle=apt_dir/'roots.pem'
              subprocess.run(['sudo','-n','install','-m','0644',str(bundle),str(apt_bundle)],check=True,capture_output=True,text=True,timeout=15)
              assert hashlib.sha256(apt_bundle.read_bytes()).digest()==hashlib.sha256(bundle.read_bytes()).digest()
              apt_config='Acquire::https::CAInfo '+json.dumps(str(apt_bundle))+';\nAcquire::https::Verify-Peer "true";\nAcquire::https::Verify-Host "true";\nAcquire::Retries "2";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n'
              subprocess.run(['sudo','-n','tee','/etc/apt/apt.conf.d/99zz-cobas-ci-trust'],input=apt_config,check=True,capture_output=True,text=True,timeout=15)
              changed=[]
              sources=[pathlib.Path('/etc/apt/sources.list'),pathlib.Path('/etc/apt/apt-mirrors.txt')]+list(pathlib.Path('/etc/apt/sources.list.d').glob('*.list'))+list(pathlib.Path('/etc/apt/sources.list.d').glob('*.sources'))
              for source in sources:
                  if not source.is_file():continue
                  before=source.read_text()
                  after=re.sub(r'https?://azure\.archive\.ubuntu\.com/ubuntu','https://archive.ubuntu.com/ubuntu',before)
                  after=re.sub(r'http://(archive|security)\.ubuntu\.com/ubuntu',r'https://\1.ubuntu.com/ubuntu',after)
                  if after!=before:
                      subprocess.run(['sudo','-n','tee',str(source)],input=after,check=True,capture_output=True,text=True,timeout=15)
                      changed.append(str(source))
              print(json.dumps({'component':'owned_apt_https_configuration','ca_sha256':hashlib.sha256(apt_bundle.read_bytes()).hexdigest(),'verify_peer':True,'verify_host':True,'official_ubuntu_mirror_files_repaired':changed,'package_signing_keys_suites_components':'unchanged','scope':'Only this disposable GitHub-hosted job'},sort_keys=True),flush=True)
          print(json.dumps({'phase':'offline_scoped_ca_prepared','source_anchors':len(roots),'kept_anchors':len(kept),'removed_public_sha256':sorted(set(roots)-set(kept)),'bundle_sha256':hashlib.sha256(bundle.read_bytes()).hexdigest(),'network_requests':0},sort_keys=True),flush=True)
