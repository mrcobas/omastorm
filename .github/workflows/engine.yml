          }))).then(rows=>console.log(JSON.stringify({node:process.version,openssl:process.versions.openssl,executable:process.execPath,rows})));
          """
          # Find the actual JavaScript action runtime, rather than trusting the action.yml label.
          node_paths = []
          for root in ['/home/runner/runners','/Users/runner/runners']:
              node_paths += sorted(pathlib.Path(root).glob('*/externals/node24/bin/node'))
          node_paths += [pathlib.Path('/__e/node24/bin/node'),pathlib.Path('/home/runner/actions-runner/externals/node24/bin/node')]
          worker_executables=[]
          for proc in pathlib.Path('/proc').glob('[0-9]*'):
              try:
                  if (proc/'comm').read_text().strip() in ('Runner.Worker','Runner.Listener'):
                      executable=(proc/'exe').resolve()
                      worker_executables.append(str(executable))
                      node_paths.insert(0,executable.parent.parent/'externals/node24/bin/node')
              except (OSError,PermissionError):
                  pass
          try:
              for line in subprocess.check_output(['ps','-axo','comm='], text=True).splitlines():
                  p=pathlib.Path(line.strip())
                  if p.name == 'Runner.Worker' and p.is_absolute():
                      node_paths.insert(0,p.parent.parent/'externals/node24/bin/node')
          except (OSError,subprocess.CalledProcessError):
              pass
          node = next((p for p in node_paths if p.is_file()),None)
          def node_probes(env):
              if node is None:
                  print(json.dumps({'runner_worker_executables':worker_executables,'node_candidates':[str(p) for p in node_paths]},sort_keys=True),flush=True)
              assert node is not None, 'Actual action node24 binary was not found' 
              return json.loads(subprocess.check_output([str(node),'-e',node_code,json.dumps(hosts+controls)],env=env,text=True,timeout=35))
          def curl_probes(env):
              def one(h):
                  r=subprocess.run(['curl','--noproxy','*','--silent','--show-error','--head','--output',os.devnull,'--connect-timeout','8','--max-time','12','https://'+h+'/'],env=env,capture_output=True,text=True,timeout=15)
                  return {'host':h,'result':'accepted_tls' if r.returncode==0 else ('rejected_certificate' if r.returncode==60 else 'transport_error'),'exit':r.returncode}
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                  return list(pool.map(one,hosts+controls))
          def gate(rows):
              assert len(rows)==18
              assert all(r['result']=='rejected_certificate' for r in rows if r['host'] in hosts), 'Affected chain accepted or network inconclusive'
              assert all(r['result']=='accepted_tls' for r in rows if r['host'] in controls), 'Normal TLS control failed'
          if probe:
              print(json.dumps({'phase':'raw_runner_before_scoped_changes','python':sys.version.split()[0],'openssl':ssl.OPENSSL_VERSION,'ca_paths':list(paths),'python_tls':python_probes(raw),'action_node':node_probes(raw_env),'curl_tls':curl_probes(raw_env)},sort_keys=True),flush=True)
          # Remove only the two public trust anchors covering the compromised emSign chains.
          # Preserve every other anchor. An empty directory prevents OpenSSL capath fallback.
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'cobas-ci-trust'
          out.mkdir(mode=0o700,parents=True,exist_ok=True)
          empty = out/'empty'; empty.mkdir(exist_ok=True)
          bundle = out/'roots.pem'
          kept = {h:c for h,c in roots.items() if h not in bad}
          bundle.write_text(''.join(ssl.DER_cert_to_PEM_cert(c) for c in kept.values()))
          assert set(roots)-set(kept) <= bad and not (set(kept)&bad)
          settings = {k:str(bundle) for k in ['SSL_CERT_FILE','CURL_CA_BUNDLE','REQUESTS_CA_BUNDLE','GIT_SSL_CAINFO','PIP_CERT']}
          settings['SSL_CERT_DIR']=str(empty)
          settings['GIT_SSL_CAPATH']=str(empty)
          settings['CARGO_HTTP_CAINFO']=str(bundle)
          # libcurl's compiled default CApath can override SSL_CERT_DIR. A job-scoped
          # curlrc closes that fallback for normal curl calls; --disable callers are separate.
          (out/'.curlrc').write_text('cacert = '+json.dumps(str(bundle))+'\ncapath = '+json.dumps(str(empty))+'\n')
          settings['CURL_HOME']=str(out)
          settings['HOMEBREW_CURLRC']=str(out/'.curlrc')
          protected_env={**raw_env,**settings,'NODE_OPTIONS':'--use-openssl-ca'}
          protected=ssl.create_default_context(cafile=str(bundle),capath=str(empty))
          print(json.dumps({'phase':'scoped_ca_prepared','source_anchors':len(roots),'kept_anchors':len(kept),'removed_public_sha256':sorted(set(roots)-set(kept)),'bundle_sha256':hashlib.sha256(bundle.read_bytes()).hexdigest(),'actual_action_node':str(node) if node else None,'provider_boundary':'Runner .NET action downloads and host container pulls happen outside this shell; this does not attest them.'},sort_keys=True),flush=True)
          if probe:
              py=python_probes(protected); nd=node_probes(protected_env); cu=curl_probes(protected_env)
              print(json.dumps({'phase':'scoped_runtime_acceptance','python_tls':py,'action_node':nd,'curl_tls':cu},sort_keys=True),flush=True)
              gate(py); gate(nd['rows']); gate(cu)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for k,v in settings.items():
                  f.write(f'{k}={v}\n')
          # NODE_OPTIONS must be set directly in workflow env; GitHub forbids setting it via GITHUB_ENV.
          CI_TRUST_PY

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-release
          path: release
      - name: Draft the engine release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" \
            --notes 'Native x86_64 and ARM64 Linux engines. Publish this release before verifying and committing release.pin in the plugin.' \
            omastorm-engine-* SHA256SUMS release.pin
