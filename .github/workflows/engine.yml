              apt_dir=pathlib.Path('/etc/apt/cobas-ci')
              subprocess.run(['sudo','-n','install','-d','-m','0755',str(apt_dir)],check=True,capture_output=True,text=True,timeout=15)
              apt_bundle=apt_dir/'roots.pem'
              subprocess.run(['sudo','-n','install','-m','0644',str(bundle),str(apt_bundle)],check=True,capture_output=True,text=True,timeout=15)
              assert hashlib.sha256(apt_bundle.read_bytes()).digest()==hashlib.sha256(bundle.read_bytes()).digest()
