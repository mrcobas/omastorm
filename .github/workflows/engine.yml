name: Engine builds

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['engine-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

# JavaScript actions use the filtered OpenSSL store prepared before checkout.
env:
  NODE_OPTIONS: --use-openssl-ca

jobs:
  build:
    name: Native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      CI_TRUST_APT: '1'
      XDG_CACHE_HOME: ${{ github.workspace }}/target/ci-cache
    steps:
      - name: Prepare scoped CI certificate trust before actions
        shell: bash
        run: |
          python3 - <<'CI_TRUST_PY'
          import hashlib, json, os, pathlib, re, ssl, subprocess, sys
          bad = {'86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b', 'd7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4'}
          keys = ['SSL_CERT_FILE', 'SSL_CERT_DIR', 'CURL_CA_BUNDLE', 'REQUESTS_CA_BUNDLE', 'GIT_SSL_CAINFO', 'PIP_CERT', 'NODE_OPTIONS', 'CURL_HOME', 'GIT_SSL_CAPATH', 'CARGO_HTTP_CAINFO']
          for k in keys:
              os.environ.pop(k, None)
          roots = {hashlib.sha256(c).hexdigest():c for c in ssl.create_default_context().get_ca_certs(binary_form=True)}
          assert len(roots) >= 80, 'Unexpectedly small runner CA store; refusing replacement'
          # Remove only the two public trust anchors covering the compromised emSign chains.
          # Preserve every other anchor. An empty directory prevents OpenSSL capath fallback.
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'cobas-ci-trust'
          out.mkdir(mode=0o700,parents=True,exist_ok=True)
          empty = out/'empty'; empty.mkdir(exist_ok=True)
          bundle = out/'roots.pem'
          kept = {h:c for h,c in roots.items() if h not in bad}
          bundle.write_text(''.join(ssl.DER_cert_to_PEM_cert(c) for c in kept.values()))
          assert set(roots)-set(kept) <= bad and not (set(kept)&bad)
          settings = {k:str(bundle) for k in ['SSL_CERT_FILE','CURL_CA_BUNDLE','REQUESTS_CA_BUNDLE','GIT_SSL_CAINFO','PIP_CERT']}
          settings['SSL_CERT_DIR']=str(empty)
          settings['GIT_SSL_CAPATH']=str(empty)
          settings['CARGO_HTTP_CAINFO']=str(bundle)
          # libcurl's compiled default CApath can override SSL_CERT_DIR. A job-scoped
          # curlrc closes that fallback for normal curl calls; --disable callers are separate.
          (out/'.curlrc').write_text('cacert = '+json.dumps(str(bundle))+'\ncapath = '+json.dumps(str(empty))+'\n')
          settings['CURL_HOME']=str(out)
          settings['HOMEBREW_CURLRC']=str(out/'.curlrc')
          # APT/GnuTLS does not inherit Node/curl trust settings. Configure its supported
          # CAInfo explicitly before owned package bootstrap; preserve package signing keys.
          apt_helper=pathlib.Path('/usr/lib/apt/apt-helper')
          if os.environ.get('CI_TRUST_APT') == '1' and sys.platform.startswith('linux') and apt_helper.is_file():
              assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_ENVIRONMENT')=='github-hosted'
              import re,tempfile
              apt_dir=pathlib.Path('/etc/apt/cobas-ci')
              subprocess.run(['sudo','-n','install','-d','-m','0755',str(apt_dir)],check=True,capture_output=True,text=True,timeout=15)
              apt_bundle=apt_dir/'roots.pem'
              subprocess.run(['sudo','-n','install','-m','0644',str(bundle),str(apt_bundle)],check=True,capture_output=True,text=True,timeout=15)
              assert hashlib.sha256(apt_bundle.read_bytes()).digest()==hashlib.sha256(bundle.read_bytes()).digest()
              apt_config='Acquire::https::CAInfo '+json.dumps(str(apt_bundle))+';\nAcquire::https::Verify-Peer "true";\nAcquire::https::Verify-Host "true";\nAcquire::Retries "2";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n'
              subprocess.run(['sudo','-n','tee','/etc/apt/apt.conf.d/99zz-cobas-ci-trust'],input=apt_config,check=True,capture_output=True,text=True,timeout=15)
              changed=[]
              sources=[pathlib.Path('/etc/apt/sources.list'),pathlib.Path('/etc/apt/apt-mirrors.txt')]+list(pathlib.Path('/etc/apt/sources.list.d').glob('*.list'))+list(pathlib.Path('/etc/apt/sources.list.d').glob('*.sources'))
              for source in sources:
                  if not source.is_file():continue
                  before=source.read_text()
                  after=re.sub(r'https?://azure\.archive\.ubuntu\.com/ubuntu','https://archive.ubuntu.com/ubuntu',before)
                  after=re.sub(r'http://(archive|security)\.ubuntu\.com/ubuntu',r'https://\1.ubuntu.com/ubuntu',after)
                  if after!=before:
                      subprocess.run(['sudo','-n','tee',str(source)],input=after,check=True,capture_output=True,text=True,timeout=15)
                      changed.append(str(source))
              print(json.dumps({'component':'owned_apt_https_configuration','ca_sha256':hashlib.sha256(apt_bundle.read_bytes()).hexdigest(),'verify_peer':True,'verify_host':True,'official_ubuntu_mirror_files_repaired':changed,'package_signing_keys_suites_components':'unchanged','scope':'Only this disposable GitHub-hosted job'},sort_keys=True),flush=True)
          print(json.dumps({'phase':'offline_scoped_ca_prepared','source_anchors':len(roots),'kept_anchors':len(kept),'removed_public_sha256':sorted(set(roots)-set(kept)),'bundle_sha256':hashlib.sha256(bundle.read_bytes()).hexdigest(),'network_requests':0},sort_keys=True),flush=True)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for k,v in settings.items():
                  f.write(f'{k}={v}\n')
          # NODE_OPTIONS is set directly in workflow env, never through GITHUB_ENV.
          CI_TRUST_PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config binutils socat
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/${{ matrix.arch }}-unknown-linux-gnu
          key: rust-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'mise.toml') }}-${{ github.sha }}
          restore-keys: rust-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'mise.toml') }}-
      - name: Verify engine tag
        run: |
          version=$(awk -F'"' '/^version = /{print $2; exit}' engine/Cargo.toml)
          if [[ "$GITHUB_REF" == refs/tags/engine-* ]]; then
            test "$GITHUB_REF_NAME" = "engine-$version"
          fi
      - name: Extract verified fixtures and fetch locked dependencies
        run: |
          bash scripts/setup-fixture.sh
          bash scripts/cargo.sh fetch --locked
      - name: Check engine and installer
        run: |
          mise lint
          mise test
          bash -x scripts/check-engine-install.sh --published-install-only > target/install-check.log 2>&1 || { cat target/install-check.log; exit 1; }
          bash scripts/check-engine-release.sh

      - name: Build native release binary
        run: |
          mise build-release
          bash scripts/check-engine-binary.sh target/dist/omastorm-engine-${{ matrix.arch }}-unknown-linux-gnu
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-native-${{ matrix.arch }}
          path: target/dist/omastorm-engine-${{ matrix.arch }}-unknown-linux-gnu*
          if-no-files-found: error

  bundle:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_TRUST_APT: '1'
    steps:
      - name: Prepare scoped CI certificate trust before actions
        shell: bash
        run: |
          python3 - <<'CI_TRUST_PY'
          import hashlib, json, os, pathlib, re, ssl, subprocess, sys
          bad = {'86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b', 'd7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4'}
          keys = ['SSL_CERT_FILE', 'SSL_CERT_DIR', 'CURL_CA_BUNDLE', 'REQUESTS_CA_BUNDLE', 'GIT_SSL_CAINFO', 'PIP_CERT', 'NODE_OPTIONS', 'CURL_HOME', 'GIT_SSL_CAPATH', 'CARGO_HTTP_CAINFO']
