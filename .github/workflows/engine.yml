              for k,v in settings.items():
                  f.write(f'{k}={v}\n')
          # NODE_OPTIONS is set directly in workflow env, never through GITHUB_ENV.
          CI_TRUST_PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engine-native-*
          merge-multiple: true
          path: target/dist
      - name: Bundle both architectures and their exact checksums
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils jq
          bash scripts/package-engine-release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-release
          path: |
            target/dist/omastorm-engine-*
            target/dist/SHA256SUMS
            target/dist/release.pin
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/engine-')
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Prepare scoped CI certificate trust before actions
        shell: bash
        run: |
          python3 - <<'CI_TRUST_PY'
          import hashlib, json, os, pathlib, re, ssl, subprocess, sys
